server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/svg+xml;

  # nginx no hereda los add_header del server en una location que define los suyos,
  # por eso las cabeceras de seguridad están en un archivo que se incluye en cada una.
  include /etc/nginx/cabeceras-seguridad.conf;

  # Sin barra final en proxy_pass: se conserva el prefijo /api que espera el backend.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    include /etc/nginx/cabeceras-seguridad.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA: cualquier ruta que no sea un archivo devuelve index.html, que nunca se cachea.
  location / {
    include /etc/nginx/cabeceras-seguridad.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
