services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmacia
      POSTGRES_USER: ${DB_USER:-farmacia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
    volumes:
      - farmacia-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/farmacia
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
    ports:
      - "127.0.0.1:8080:8080"

  # El servicio web lo agrega el prompt del frontend.

volumes:
  farmacia-db:
